name: Build Kian-OS v3 (Council Approved x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build/02_bootstrap_rootfs.sh'
      - 'build/03_customize_desktop.sh'
      - 'build/04_build_iso.sh'
      - 'build/05_verify_iso.sh'
      - 'desktop/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/build-kiyan-os.yml'

permissions:
  contents: write

jobs:
  build-kian-iso:
    name: Assemble, Boot-Verify & Release Kian-OS v3 Hybrid ISO (Ubuntu 24.04 Noble)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout Kian-OS Repository
        uses: actions/checkout@v4

      - name: Fix Runner DNS (Cloudflare DoH + 1.1.1.1) & Switch APT to HTTPS CDN Mirrors
        run: |
          set -euo pipefail
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\noptions timeout:2 attempts:2\n" \
            | sudo tee /etc/resolv.conf >/dev/null
          sudo chmod 0644 /etc/resolv.conf

          sudo python3 - <<'PY'
          import json, urllib.request

          hosts = [
              "azure.archive.ubuntu.com",
              "archive.ubuntu.com",
              "security.ubuntu.com",
              "mirrors.edge.kernel.org",
              "packages.mozilla.org",
              "github.com",
              "api.github.com",
              "objects.githubusercontent.com",
              "release-assets.githubusercontent.com",
          ]
          lines = []
          for h in hosts:
              try:
                  req = urllib.request.Request(
                      f"https://1.1.1.1/dns-query?name={h}&type=A",
                      headers={"Accept": "application/dns-json", "User-Agent": "kian-ci/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=8) as r:
                      data = json.loads(r.read().decode())
                  ips = [
                      ans["data"]
                      for ans in data.get("Answer", [])
                      if ans.get("type") == 1 and ans.get("data")
                  ]
                  if ips:
                      lines.append(f"{ips[0]} {h}")
                      print(f"[DoH] {h} -> {ips[0]}")
              except Exception as exc:
                  print(f"[DoH WARN] {h}: {exc}")

          if lines:
              with open("/etc/hosts", "a", encoding="utf-8") as fh:
                  fh.write("\n# Kian-OS CI DoH Bootstrap\n" + "\n".join(lines) + "\n")
          PY

          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf "https://mirrors.edge.kernel.org/ubuntu/\nhttps://archive.ubuntu.com/ubuntu/\n" \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$f" ]]; then
              sudo sed -i \
                -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/\?|https://mirrors.edge.kernel.org/ubuntu/|g' \
                -e 's|http://archive\.ubuntu\.com/ubuntu/\?|https://mirrors.edge.kernel.org/ubuntu/|g' \
                -e 's|http://security\.ubuntu\.com/ubuntu/\?|https://security.ubuntu.com/ubuntu/|g' \
                "$f"
            fi
          done

      - name: Maximize Runner Disk Space & Install ISO Mastering + QEMU/KVM Verification Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          printf '%s\0' /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            | sudo xargs -0 -P4 rm -rf || true
          df -h /
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-efi-amd64-bin mtools dosfstools \
            zstd xz-utils cpio initramfs-tools-core sbsigntool kmod libarchive-tools \
            isolinux syslinux-common qemu-system-x86 qemu-utils ovmf imagemagick python3-yaml

      - name: Download Verified & MOK-Signed linux-kian v3 Superkernel Packages (Build #20)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/kernel_pkgs build/out/kernel_pkgs
          gh release download linux-kian-v3-build-20 -R manmojt/kiyan-os -D build/kernel_pkgs/ -p '*.deb' -p 'SHA256SUMS'
          (cd build/kernel_pkgs && sha256sum -c SHA256SUMS)
          cp -f build/kernel_pkgs/*.deb build/out/kernel_pkgs/
          ls -lh build/kernel_pkgs/

      - name: Validate Calamares YAML Configs & Execute Clean-Slate ISO Build Pipeline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob("installer/calamares/**/*.conf", recursive=True) + ["installer/calamares/settings.conf"]):
              with open(path, encoding="utf-8") as fh:
                  data = yaml.safe_load(fh)
              assert isinstance(data, dict), f"Invalid YAML object in {path}"
              print(f"[YAML OK] {path}")
          PY
          sudo ./scripts/build-kian-iso.sh
          sudo chown -R "$USER:$USER" output dist

      - name: Real QEMU/KVM Live Desktop Boot & Framebuffer Screenshot Gate (ZERO Swallowed Errors)
        run: |
          set -euo pipefail
          ISO_FILE="output/kian-os-v3-noble-amd64.iso"
          test -s "${ISO_FILE}"
          mkdir -p /tmp/qemu-live

          # 1. Inject live verification probe via kernel cmdline / serial console?
          #    Better: boot the untouched production ISO directly via UEFI (OVMF) OR BIOS CDROM with KVM/max CPU,
          #    monitor serial log (/dev/ttyS0) until systemd + SDDM/Wayland live boot completes,
          #    AND capture framebuffer via QEMU QMP screendump!
          ACCEL_ARGS=(-cpu max)
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo ":: Hardware KVM acceleration available (/dev/kvm)!"
            ACCEL_ARGS=(-enable-kvm -cpu host)
          else
            echo ":: /dev/kvm not writable; using sudo / software TCG -cpu max..."
            if sudo test -r /dev/kvm && sudo test -w /dev/kvm; then
              sudo chmod 0666 /dev/kvm
              ACCEL_ARGS=(-enable-kvm -cpu host)
              echo ":: Enabled /dev/kvm access for runner!"
            fi
          fi

          # Find OVMF firmware code file so we test REAL UEFI GRUB -> linux-kian v3 -> Casper -> Plasma Wayland!
          OVMF_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/ovmf/OVMF.fd; do
            if [[ -f "$f" ]]; then
              OVMF_CODE="$f"
              break
            fi
          done
          UEFI_ARGS=()
          if [[ -n "${OVMF_CODE}" ]]; then
            echo ":: Booting ISO in Pure UEFI Mode using ${OVMF_CODE}"
            UEFI_ARGS=(-drive "if=pflash,format=raw,readonly=on,file=${OVMF_CODE}")
          fi

          python3 - "${ISO_FILE}" "${ACCEL_ARGS[@]}" "--" "${UEFI_ARGS[@]}" <<'PY'
          import json, os, select, socket, subprocess, sys, time

          argv = sys.argv[1:]
          sep = argv.index("--")
          iso_file = argv[0]
          accel_args = argv[1:sep]
          uefi_args = argv[sep + 1:]

          serial_log = "/tmp/qemu-live/live_serial.log"
          serial_sock_path = "/tmp/qemu-live/serial.sock"
          qmp_sock = "/tmp/qemu-live/qmp.sock"
          ppm_path = "/tmp/qemu-live/live_desktop.ppm"
          calamares_ppm_path = "/tmp/qemu-live/calamares_desktop.ppm"
          target_disk = "/tmp/qemu-live/target_disk.qcow2"

          for p in (serial_log, serial_sock_path, qmp_sock, ppm_path, calamares_ppm_path, target_disk):
              if os.path.exists(p):
                  os.remove(p)

          subprocess.run(["qemu-img", "create", "-f", "qcow2", target_disk, "20G"], check=True)

          cmd = [
              "qemu-system-x86_64",
              *accel_args,
              "-m", "4096M",
              "-smp", str(os.cpu_count() or 2),
              *uefi_args,
              "-cdrom", iso_file,
              "-drive", f"file={target_disk},if=virtio,format=qcow2",
              "-boot", "d",
              "-vga", "virtio",
              "-display", "none",
              "-no-reboot",
              "-serial", f"unix:{serial_sock_path},server,nowait",
              "-qmp", f"unix:{qmp_sock},server,nowait",
          ]
          print("Launching QEMU:", " ".join(cmd), flush=True)
          proc = subprocess.Popen(cmd)

          ser = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          for _ in range(50):
              if os.path.exists(serial_sock_path):
                  try:
                      ser.connect(serial_sock_path)
                      break
                  except OSError:
                      pass
              time.sleep(0.2)
          else:
              proc.kill()
              raise RuntimeError("Failed to connect to QEMU serial UNIX socket!")
          ser.setblocking(False)

          def send_serial(sock: socket.socket, text: str) -> None:
              data = text.encode("utf-8")
              for idx in range(0, len(data), 8):
                  sock.sendall(data[idx:idx + 8])
                  time.sleep(0.015)

          def qmp_screendump(out_ppm: str) -> None:
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(qmp_sock)
              f = s.makefile("r", encoding="utf-8")
              _ = f.readline()  # greeting
              s.sendall(b'{"execute":"qmp_capabilities"}\n')
              _ = f.readline()
              payload = json.dumps({"execute": "screendump", "arguments": {"filename": out_ppm}}) + "\n"
              s.sendall(payload.encode("utf-8"))
              resp = f.readline()
              print(f"QMP screendump ({out_ppm}) response:", resp.strip(), flush=True)
              s.close()

          probe1_cmd = (
              "echo KIAN_PROBE_BEGIN_$((10+1)); "
              "uname -a; "
              "sudo dmesg | grep -iE 'Linux version|BORE' | head -n 12; "
              "ls -l /dev/ntsync; "
              "sudo /usr/share/calamares/hooks/pre-install-probe.sh >/tmp/preprobe.log 2>&1 && "
              "test -s /cdrom/casper/filesystem.squashfs && echo SQUASHFS_SOURCE_OK_$((50+5)); "
              "for i in $(seq 1 45); do "
              "if pgrep -u kian -f '[p]lasmashell' >/dev/null 2>&1 && pgrep -u kian -f '[k]win_wayland' >/dev/null 2>&1; then "
              "echo PLASMA_WAYLAND_READY_$((40+2)); "
              "ps -u kian -o pid,comm | grep -E 'kwin_wayland|plasmashell'; "
              "break; "
              "fi; sleep 1; done; "
              "for i in $(seq 1 30); do pgrep -u kian -x ksplashqml >/dev/null 2>&1 || break; sleep 1; done; "
              "for i in $(seq 1 30); do test -f /home/kian/.config/kian/.initialized_v3 && break; sleep 1; done; "
              "sleep 4; "
              "echo KIAN_PROBE1_DONE_$((100+23))\n"
          )

          probe2_cmd = (
              "env $(sudo tr '\\0' '\\n' < /proc/$(pgrep -u kian -xo plasmashell)/environ | "
              "grep -E '^(DBUS_SESSION_BUS_ADDRESS|XDG_RUNTIME_DIR|WAYLAND_DISPLAY|DISPLAY)=') "
              "QT_QPA_PLATFORM='wayland;xcb' "
              "kioclient5 exec /home/kian/Desktop/calamares.desktop >/tmp/kio_calamares.log 2>&1 & "
              "for i in $(seq 1 30); do "
              "if pgrep -u root -x calamares >/dev/null 2>&1; then "
              "sleep 10; "
              "if pgrep -u root -x calamares >/dev/null 2>&1; then "
              "echo CALAMARES_GUI_ALIVE_$((70+7)); "
              "fi; "
              "break; "
              "fi; sleep 1; done; "
              "tail -n 25 /tmp/kio_calamares.log /tmp/calamares-launch.log 2>/dev/null; "
              "echo KIAN_PROBE2_DONE_$((200+34))\n"
          )

          state = "WAIT_LOGIN"
          state_pos = 0
          state_ts = time.time()
          buf = ""
          deadline = time.time() + 270

          with open(serial_log, "wb") as log_fh:
              while time.time() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError(f"QEMU exited prematurely with code {proc.returncode}!")
                  rlist, _, _ = select.select([ser], [], [], 0.25)
                  if rlist:
                      chunk = ser.recv(4096)
                      if chunk:
                          log_fh.write(chunk)
                          log_fh.flush()
                          buf += chunk.decode("utf-8", errors="replace")

                  tail = buf[state_pos:]
                  if state == "WAIT_LOGIN":
                      if "kian-os login:" in tail:
                          print("Serial login prompt reached! Sending username 'kian'...", flush=True)
                          time.sleep(0.5)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "kian\n")
                          state = "WAIT_AUTH"
                  elif state == "WAIT_AUTH":
                      if "Password:" in tail:
                          print("Password prompt reached! Authenticating live user 'kian'...", flush=True)
                          time.sleep(0.3)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "kian\n")
                          state = "WAIT_SHELL"
                      elif ("kian@kian-os" in tail or "$ " in tail):
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, probe1_cmd)
                          state = "WAIT_PROBE1"
                      elif time.time() - state_ts > 15:
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "\nkian\n")
                  elif state == "WAIT_SHELL":
                      if ("kian@kian-os" in tail or "$ " in tail):
                          print("Live shell active! Running Probe 1 (kernel/BORE/NTSync/SquashFS/Wayland)...", flush=True)
                          time.sleep(0.3)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, probe1_cmd)
                          state = "WAIT_PROBE1"
                      elif "Login incorrect" in tail:
                          raise RuntimeError("Live serial login rejected password for 'kian'!")
                  elif state == "WAIT_PROBE1":
                      if "KIAN_PROBE1_DONE_123" in tail:
                          print("Probe 1 completed! Capturing clean desktop screenshot & double-clicking Install Kian-OS v3...", flush=True)
                          qmp_screendump(ppm_path)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, probe2_cmd)
                          state = "WAIT_PROBE2"
                  elif state == "WAIT_PROBE2":
                      if "KIAN_PROBE2_DONE_234" in tail:
                          print("Probe 2 completed! Capturing live Calamares GUI screenshot...", flush=True)
                          qmp_screendump(calamares_ppm_path)
                          break

          if not os.path.exists(ppm_path):
              qmp_screendump(ppm_path)
          if not os.path.exists(calamares_ppm_path):
              qmp_screendump(calamares_ppm_path)

          ser.close()
          proc.terminate()
          try:
              proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              proc.kill()
          PY

          convert /tmp/qemu-live/live_desktop.ppm /tmp/qemu-live/boot_screenshot.png
          convert /tmp/qemu-live/calamares_desktop.ppm /tmp/qemu-live/calamares_screenshot.png
          cp -f /tmp/qemu-live/boot_screenshot.png output/boot_screenshot.png
          cp -f /tmp/qemu-live/calamares_screenshot.png output/calamares_screenshot.png
          cp -f /tmp/qemu-live/live_serial.log output/live_serial.log

          echo "=== LIVE ISO SERIAL BOOT & CALAMARES DOUBLE-CLICK PROBE VERIFICATION ==="
          tail -n 80 /tmp/qemu-live/live_serial.log | tr -d '\033\r'

          # HARD GATES (ZERO || true!)
          grep -q "Linux version 6.8.12-kian-v3" /tmp/qemu-live/live_serial.log
          grep -qi "BORE" /tmp/qemu-live/live_serial.log
          grep -q "/dev/ntsync" /tmp/qemu-live/live_serial.log
          grep -q "SQUASHFS_SOURCE_OK_55" /tmp/qemu-live/live_serial.log
          grep -q "PLASMA_WAYLAND_READY_42" /tmp/qemu-live/live_serial.log
          grep -q "CALAMARES_GUI_ALIVE_77" /tmp/qemu-live/live_serial.log
          if grep -qi "Kernel panic" /tmp/qemu-live/live_serial.log; then
            echo "FATAL: Kernel panic detected during Live ISO boot!" >&2
            exit 1
          fi
          test -s output/boot_screenshot.png
          test -s output/calamares_screenshot.png
          echo "[PASS] Production ISO booted cleanly & Desktop Double-Click launched Calamares GUI on Wayland!"

      - name: Upload Live Boot Screenshot & Serial Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kian-os-v3-live-boot-evidence
          path: |
            output/boot_screenshot.png
            output/calamares_screenshot.png
            output/live_serial.log
          if-no-files-found: ignore

      - name: Publish Verified Kian-OS v3 ISO & Boot Proof to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd output
          sha256sum kian-os-v3-noble-amd64.iso boot_screenshot.png calamares_screenshot.png live_serial.log > SHA256SUMS
          TAG="kian-v3-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --title "Kian-OS v3 Verified Hybrid OS (x86_64, linux-kian 6.8.12-kian-v3 MOK Signed) Build #${GITHUB_RUN_NUMBER}" \
            --notes "End-to-end cryptographically signed and KVM/UEFI live-boot + Calamares double-click verified Kian-OS v3 (Ubuntu 24.04 LTS Noble, linux-kian 6.8.12-kian-v3 with BORE 1000Hz + NTSync + BBRv3, Full AMD/Intel/NVIDIA KMS Firmware + kscreen Native Display, Pure KDE Wayland, Calamares 3.3 Btrfs Zstd-3 installer, Dual-Kernel Watchdog)." \
            --latest \
            kian-os-v3-noble-amd64.iso \
            kian-os-v3-noble-amd64.iso.sha256 \
            SHA256SUMS \
            boot_screenshot.png \
            calamares_screenshot.png \
            live_serial.log
