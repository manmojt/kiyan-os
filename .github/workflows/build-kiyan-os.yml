name: Build Kiyan OS LB1

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_image:
        description: Rebuild and sign the OS image before building the ISO
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kiyan-os-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.build_image == false && 'iso-only' || 'full' }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Decide whether the OCI image needs rebuilding
    runs-on: ubuntu-latest
    outputs:
      rebuild_image: ${{ steps.detect.outputs.rebuild_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect image inputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_BUILD_IMAGE: ${{ inputs.build_image }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "rebuild_image=$REQUESTED_BUILD_IMAGE" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "rebuild_image=true" >> "$GITHUB_OUTPUT"
          else
            changed_image_inputs="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- recipes/ files/ cosign.pub)"
            if [[ -n "$changed_image_inputs" ]]; then
              echo "rebuild_image=true" >> "$GITHUB_OUTPUT"
            else
              echo "rebuild_image=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-image:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs['detect-changes'].outputs.rebuild_image == 'true'
    name: Build and sign OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push with BlueBuild
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: recipe.yml
          cli_version: v0.9.41
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry: ghcr.io
          registry_namespace: manmojt
          registry_token: ${{ github.token }}
          registry_username: ${{ github.repository_owner }}
          pr_event_number: ${{ github.event.number || 0 }}
          chunkah: true
          maximize_build_space: true

  build-iso-and-publish:
    if: ${{ always() && github.ref == 'refs/heads/main' && needs['detect-changes'].result == 'success' && (needs['build-image'].result == 'success' || (needs['build-image'].result == 'skipped' && needs['detect-changes'].outputs.rebuild_image == 'false')) }}
    name: Build ISO and publish signed release
    needs: [detect-changes, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ISO signature inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbsigntool sqlite3 xorriso

      - name: Configure rootful Podman storage for image-builder
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf >/dev/null
          sudo podman info >/dev/null
          echo "update DBConfig set GraphDriver = 'overlay' where GraphDriver = '';" \
            | sudo sh -c '(cd /var/lib/containers/storage && sqlite3 db.sql)'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/cosign-bin

      - name: Verify signed source image
        env:
          COSIGN_BIN: ${{ runner.temp }}/cosign-bin
        run: |
          "$COSIGN_BIN/cosign" verify --key cosign.pub ghcr.io/manmojt/kiyan-os:latest

      - name: Build Anaconda ISO with the published bootc image
        id: build-anaconda-iso
        run: |
          set -euo pipefail
          source_image=ghcr.io/manmojt/kiyan-os:latest
          installer_iso="$RUNNER_TEMP/Fedora-Server-dvd-x86_64-44-1.7.iso"
          kickstart="$RUNNER_TEMP/kiyan-bootc.ks"
          iso_output="$GITHUB_WORKSPACE/output/Kiyan-OS-LB1-x86_64.iso"
          curl --fail --location --retry 3 \
            --output "$installer_iso" \
            https://download.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso/Fedora-Server-dvd-x86_64-44-1.7.iso

          cat > "$kickstart" <<EOF
          # Install the verified published Kiyan OS bootc image.
          ostreecontainer --url $source_image --no-signature-verification
          EOF
          mkdir -p output
          sudo podman run --rm --security-opt label=disable \
            --volume "$RUNNER_TEMP:/work:ro" \
            --volume "$GITHUB_WORKSPACE/output:/output" \
            registry.fedoraproject.org/fedora:44 \
            bash -euc 'dnf install --assumeyes lorax && mkksiso --ks /work/kiyan-bootc.ks /work/Fedora-Server-dvd-x86_64-44-1.7.iso /output/Kiyan-OS-LB1-x86_64.iso'

          sudo chown -R "$(id -u):$(id -g)" output
          test -s "$iso_output"
          echo "anaconda-iso-output-path=$iso_output" >> "$GITHUB_OUTPUT"

      - name: Validate ISO boot entries and signed UEFI shim
        env:
          ISO_PATH: ${{ steps.build-anaconda-iso.outputs.anaconda-iso-output-path }}
        run: |
          set -euo pipefail
          test -s "$ISO_PATH"
          mkdir -p output
          iso=output/Kiyan-OS-LB1-x86_64.iso
          mv "$ISO_PATH" "$iso"
          test -s "$iso"
          file "$iso"

          xorriso -indev "$iso" -report_el_torito plain | tee output/boot-media-report.txt
          grep -qi 'BIOS' output/boot-media-report.txt
          grep -qi 'UEFI' output/boot-media-report.txt

          xorriso -osirrox on -indev "$iso" \
            -extract /EFI/BOOT/BOOTX64.EFI output/BOOTX64.EFI
          test -s output/BOOTX64.EFI
          sbverify --list output/BOOTX64.EFI

      - name: Sign ISO and split it into GitHub Release-sized assets
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          iso=output/Kiyan-OS-LB1-x86_64.iso
          key="$RUNNER_TEMP/cosign.key"
          umask 077
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key"
          "$RUNNER_TEMP/cosign-bin/cosign" sign-blob --yes --key "$key" \
            --bundle "$iso.sigstore.json" "$iso"
          (cd output && sha256sum Kiyan-OS-LB1-x86_64.iso > Kiyan-OS-LB1-x86_64.iso.sha256)
          split --bytes=1800MiB --numeric-suffixes=0 --suffix-length=3 \
            "$iso" "$iso.part-"

      - name: Publish versioned public release for the VPS pull timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="kiyan-lb1-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          mapfile -t parts < <(find output -maxdepth 1 -type f -name 'Kiyan-OS-LB1-x86_64.iso.part-*' -print | sort)
          if (( ${#parts[@]} == 0 )); then
            echo 'ISO split produced no release assets' >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Kiyan OS LB1 ${GITHUB_RUN_NUMBER}" \
            --notes "Automated, signed Kiyan OS LB1 ISO for commit ${GITHUB_SHA}." \
            --latest \
            output/Kiyan-OS-LB1-x86_64.iso.sha256 \
            output/Kiyan-OS-LB1-x86_64.iso.sigstore.json \
            "${parts[@]}"
