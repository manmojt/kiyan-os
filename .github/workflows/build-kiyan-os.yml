name: Build Kian-OS v3 (Council Approved x86_64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kian-iso:
    name: Assemble Clean-Slate Kian-OS v3 Hybrid ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Kian-OS Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space & Install ISO Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools zstd libarchive-tools

      - name: Download Verified linux-kian v3 Superkernel Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/kernel_pkgs
          gh release download linux-kian-v3-build-14 -R manmojt/kiyan-os -D build/kernel_pkgs/ -p '*.deb'
          ls -lh build/kernel_pkgs/

      - name: Execute Council-Approved Kian-OS v3 Clean Build Pipeline
        run: sudo ./scripts/build-kian-iso.sh

      - name: Publish Unified Kian-OS v3 ISO to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          TAG="kian-v3-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             --title "Kian-OS v3 Zero-Flaw Hybrid OS (x86_64) Build #${GITHUB_RUN_NUMBER}"             --notes "Official Production Release of Kian-OS v3 Hybrid Operating System. Powered by linux-kian v3 Superkernel (BORE 1000Hz, NTSync, Surface SAM/IPTS, Intel IPU6, Apple SPI Force Touch, Pure Wayland, Triple-Shell Engine, and Btrfs Atomic Rollback)."             --latest             kian-os-v3-noble-amd64.iso             kian-os-v3-noble-amd64.iso.sha256             SHA256SUMS
