name: Build Kiyan OS v4 (Core & Pro Free Editions — Zorin 18 + GNOME 46 + Liquorix 7.3)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-kiyan-os-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-edition:
    name: Build & Live-Boot Verify Kiyan OS v4 (${{ matrix.edition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [core, pro]

    steps:
      - name: Checkout Kiyan OS Repository
        uses: actions/checkout@v4

      - name: Fix Runner DNS (Cloudflare DoH + 1.1.1.1) & Enforce IPv4 Resilient Mirrors
        run: |
          set -euo pipefail
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\noptions timeout:2 attempts:2\n" \
            | sudo tee /etc/resolv.conf >/dev/null
          sudo chmod 0644 /etc/resolv.conf

          sudo python3 - <<'PY'
          import json, urllib.request
          hosts = [
              "archive.ubuntu.com",
              "security.ubuntu.com",
              "ppa.launchpadcontent.net",
              "keyserver.ubuntu.com",
              "packages.mozilla.org",
              "extensions.gnome.org",
              "github.com",
              "api.github.com",
              "objects.githubusercontent.com",
          ]
          lines = []
          for h in hosts:
              try:
                  req = urllib.request.Request(
                      f"https://1.1.1.1/dns-query?name={h}&type=A",
                      headers={"Accept": "application/dns-json", "User-Agent": "kiyan-ci/4.0"},
                  )
                  with urllib.request.urlopen(req, timeout=8) as r:
                      data = json.loads(r.read().decode())
                  ips = [a["data"] for a in data.get("Answer", []) if a.get("type") == 1 and a.get("data")]
                  if ips:
                      lines.append(f"{ips[0]} {h}")
                      print(f"[DoH] {h} -> {ips[0]}")
              except Exception as exc:
                  print(f"[DoH WARN] {h}: {exc}")
          if lines:
              with open("/etc/hosts", "a", encoding="utf-8") as fh:
                  fh.write("\n# Kiyan OS CI DoH Bootstrap\n" + "\n".join(lines) + "\n")
          PY

          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-runner-force-ipv4 >/dev/null
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$f" ]]; then
              sudo sed -i \
                -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/\?|https://archive.ubuntu.com/ubuntu/|g' \
                -e 's|http://archive\.ubuntu\.com/ubuntu/\?|https://archive.ubuntu.com/ubuntu/|g' \
                -e 's|http://security\.ubuntu\.com/ubuntu/\?|https://security.ubuntu.com/ubuntu/|g' \
                "$f"
            fi
          done

      - name: Maximize Runner Disk Space (45+ GB Free) & Install ISO Mastering + QEMU/KVM Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          printf '%s\0' /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium \
            | sudo xargs -0 -P4 rm -rf || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso isolinux syslinux-common syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed mtools dosfstools \
            sbsigntool openssl initramfs-tools kmod binutils file curl ca-certificates jq \
            python3 python3-yaml qemu-system-x86 qemu-utils ovmf imagemagick

      - name: Validate Calamares Configs & Build Kiyan OS v4 (${{ matrix.edition }}) Hybrid ISO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, yaml
          files = ["installer/calamares/settings.conf", "installer/calamares/branding/kian/branding.desc"] + sorted(glob.glob("installer/calamares/modules/*.conf"))
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  doc = yaml.safe_load(fh)
              assert isinstance(doc, dict), f"{path} did not parse to a YAML mapping!"
              print(f"[YAML OK] {path}")
          PY

          sudo -E env KIYAN_EDITION="${{ matrix.edition }}" \
            ./build/build_all.sh --skip-kernel --edition "${{ matrix.edition }}" \
            --mirror https://archive.ubuntu.com/ubuntu/ -j "$(nproc)"

          mkdir -p output
          ISO_FILE="dist/kiyan-os-v4-${{ matrix.edition }}-noble-amd64.iso"
          sudo chown -R "$USER:$USER" dist build/out/iso_tree || true
          sudo rm -rf build/out
          mv "${ISO_FILE}" "output/kiyan-os-v4-${{ matrix.edition }}-noble-amd64.iso"
          sha256sum "output/kiyan-os-v4-${{ matrix.edition }}-noble-amd64.iso" > "output/kiyan-os-v4-${{ matrix.edition }}-noble-amd64.iso.sha256"
          ls -lh output/

      - name: Real QEMU/KVM Live Zorin GNOME 46 Wayland Boot, Appearance & Calamares Gate (ZERO Swallowed Errors)
        run: |
          set -euo pipefail
          EDITION="${{ matrix.edition }}"
          ISO_PATH="$PWD/output/kiyan-os-v4-${EDITION}-noble-amd64.iso"
          rm -rf /tmp/qemu-live
          mkdir -p /tmp/qemu-live

          OVMF_CODE=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/ovmf/OVMF.fd; do
            if [[ -f "$p" ]]; then OVMF_CODE="$p"; break; fi
          done
          test -n "$OVMF_CODE"

          KVM_FLAGS=(-cpu max -smp 4)
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            KVM_FLAGS=(-enable-kvm -cpu host -smp 4)
          fi

          python3 - "$ISO_PATH" "$OVMF_CODE" "${KVM_FLAGS[@]}" <<'PY'
          import json, os, select, socket, subprocess, sys, time

          iso_path = sys.argv[1]
          ovmf_code = sys.argv[2]
          kvm_flags = sys.argv[3:]

          qmp_sock = "/tmp/qemu-live/qmp.sock"
          serial_sock = "/tmp/qemu-live/serial.sock"
          serial_log = "/tmp/qemu-live/live_serial.log"
          ppm_desk = "/tmp/qemu-live/live_desktop.ppm"
          ppm_app = "/tmp/qemu-live/appearance_desktop.ppm"
          ppm_cal = "/tmp/qemu-live/calamares_desktop.ppm"
          disk_img = "/tmp/qemu-live/target_nvme.qcow2"
          subprocess.run(["qemu-img", "create", "-f", "qcow2", disk_img, "32G"], check=True)

          cmd = [
              "qemu-system-x86_64",
              *kvm_flags,
              "-m", "4096M",
              "-drive", f"if=pflash,format=raw,readonly=on,file={ovmf_code}",
              "-cdrom", iso_path,
              "-drive", f"file={disk_img},if=virtio,format=qcow2",
              "-boot", "d",
              "-vga", "virtio",
              "-display", "none",
              "-no-reboot",
              "-chardev", f"socket,id=charserial0,path={serial_sock},server=on,wait=off",
              "-device", "isa-serial,chardev=charserial0",
              "-qmp", f"unix:{qmp_sock},server=on,wait=off",
          ]
          print("Starting QEMU Live Zorin GNOME 46 Wayland VM:", " ".join(cmd), flush=True)
          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

          for _ in range(50):
              if os.path.exists(qmp_sock) and os.path.exists(serial_sock):
                  break
              time.sleep(0.2)

          ser = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          ser.connect(serial_sock)
          ser.setblocking(False)

          def send_serial(sock, text: str) -> None:
              sock.sendall(text.encode("utf-8"))

          def qmp_switch_vt(vt_num: int) -> None:
              qcode = f"f{vt_num}"
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(qmp_sock)
              f = s.makefile("r", encoding="utf-8")
              _ = f.readline()
              s.sendall(b'{"execute":"qmp_capabilities"}\n')
              _ = f.readline()
              payload = json.dumps({
                  "execute": "send-key",
                  "arguments": {
                      "keys": [
                          {"type": "qcode", "data": "ctrl"},
                          {"type": "qcode", "data": "alt"},
                          {"type": "qcode", "data": qcode},
                      ],
                      "hold-time": 120,
                  },
              }) + "\n"
              s.sendall(payload.encode("utf-8"))
              _ = f.readline()
              s.close()

          def qmp_send_key(keys) -> None:
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(qmp_sock)
              f = s.makefile("r", encoding="utf-8")
              _ = f.readline()
              s.sendall(b'{"execute":"qmp_capabilities"}\n')
              _ = f.readline()
              payload = json.dumps({"execute": "send-key", "arguments": {"keys": [{"type": "qcode", "data": k} for k in keys]}}) + "\n"
              s.sendall(payload.encode("utf-8"))
              _ = f.readline()
              s.close()

          def qmp_screendump(out_ppm: str) -> None:
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(qmp_sock)
              f = s.makefile("r", encoding="utf-8")
              _ = f.readline()
              s.sendall(b'{"execute":"qmp_capabilities"}\n')
              _ = f.readline()
              payload = json.dumps({"execute": "screendump", "arguments": {"filename": out_ppm}}) + "\n"
              s.sendall(payload.encode("utf-8"))
              resp = f.readline()
              print(f"QMP screendump ({out_ppm}) response:", resp.strip(), flush=True)
              s.close()

          probe1_cmd = (
              "echo KIYAN_PROBE_BEGIN_$((10+1)); "
              "uname -a; "
              "ls -l /dev/ntsync; "
              "sudo /usr/share/calamares/hooks/pre-install-probe.sh >/tmp/preprobe.log 2>&1 && "
              "test -s /cdrom/casper/filesystem.squashfs && echo SQUASHFS_SOURCE_OK_$((50+5)); "
              "for i in $(seq 1 120); do "
              "if pgrep -u kian -x gnome-shell >/dev/null 2>&1; then "
              "echo GNOME_WAYLAND_READY_$((40+2)); "
              "break; "
              "fi; sleep 1; done; "
              "for i in $(seq 1 90); do "
              "if ls /run/user/1000/wayland-* >/dev/null 2>&1 || ls /tmp/.X11-unix/X* >/dev/null 2>&1; then "
              "echo DISPLAY_SOCKET_OPEN_$((60+6)); "
              "break; "
              "fi; sleep 1; done; "
              "for sid in $(loginctl list-sessions --no-legend | awk '$3==\"kian\" {print $1}'); do "
              "STYPE=$(loginctl show-session \"$sid\" -p Type --value 2>/dev/null || true); "
              "SVT=$(loginctl show-session \"$sid\" -p VTNr --value 2>/dev/null || true); "
              "echo \"SESSION sid=$sid type=$STYPE vt=$SVT\"; "
              "if [ \"$STYPE\" = \"wayland\" ] || [ \"$STYPE\" = \"x11\" ]; then "
              "sudo loginctl activate \"$sid\" || true; "
              "break; "
              "fi; done; "
              "sleep 6; "
              "echo KIYAN_PROBE1_DONE_$((100+23))\n"
          )

          probe2_cmd = (
              "WL_CUR=$(ls /run/user/1000/wayland-* 2>/dev/null | grep -v '\\.lock$' | head -n1 | xargs -r basename); "
              "X_CUR=$(ls /tmp/.X11-unix/X* 2>/dev/null | head -n1 | sed 's|.*/X|:|'); "
              "echo \"ACTIVE_SOCKETS wayland=$WL_CUR x11=$X_CUR\"; "
              "if ! pgrep -u kian -x gnome-shell >/dev/null 2>&1; then "
              "echo 'WARN: gnome-shell not running before probe2; dumping journal:'; "
              "sudo journalctl -b --no-pager | grep -Ei 'gnome-shell|mutter|gdm|segfault|trap|JS ERROR' | tail -n 40 || true; "
              "fi; "
              "env XDG_CURRENT_DESKTOP='zorin:GNOME' "
              "XDG_RUNTIME_DIR='/run/user/1000' WAYLAND_DISPLAY=\"${WL_CUR:-wayland-0}\" DISPLAY=\"${X_CUR:-:0}\" "
              "DBUS_SESSION_BUS_ADDRESS='unix:path=/run/user/1000/bus' "
              "zorin-appearance >/tmp/appearance.log 2>&1 & "
              "sleep 8; "
              "if pgrep -u kian -f zorin-appearance >/dev/null 2>&1; then echo APPEARANCE_GUI_ALIVE_$((30+3)); "
              "else cat /tmp/appearance.log || true; sudo journalctl -b --no-pager | grep -Ei 'gnome-shell|mutter|gdm|segfault|trap|JS ERROR' | tail -n 40 || true; fi; "
              "echo KIYAN_PROBE2_DONE_$((200+11))\n"
          )

          probe3_cmd = (
              "pkill -f zorin-appearance || true; sleep 1; "
              "WL_CUR=$(ls /run/user/1000/wayland-* 2>/dev/null | grep -v '\\.lock$' | head -n1 | xargs -r basename); "
              "X_CUR=$(ls /tmp/.X11-unix/X* 2>/dev/null | head -n1 | sed 's|.*/X|:|'); "
              "env XDG_RUNTIME_DIR='/run/user/1000' WAYLAND_DISPLAY=\"${WL_CUR:-wayland-0}\" DISPLAY=\"${X_CUR:-:0}\" "
              "DBUS_SESSION_BUS_ADDRESS='unix:path=/run/user/1000/bus' "
              "/usr/bin/kian-install-os >/tmp/cal_wrap.log 2>&1 & "
              "for i in $(seq 1 60); do "
              "if pgrep -u root -x calamares >/dev/null 2>&1; then "
              "sleep 12; "
              "if pgrep -u root -x calamares >/dev/null 2>&1; then echo CALAMARES_GUI_ALIVE_$((70+7)); fi; "
              "break; "
              "fi; sleep 1; done; "
              "if ! pgrep -u root -x calamares >/dev/null 2>&1; then "
              "sudo ls -la /run/calamares-runtime-root /run/user/1000 /tmp/.X11-unix 2>&1 || true; "
              "cat /tmp/cal_wrap.log /tmp/calamares-launch.log 2>/dev/null || true; "
              "fi; "
              "echo KIYAN_PROBE3_DONE_$((300+45))\n"
          )

          state = "WAIT_LOGIN"
          state_pos = 0
          state_ts = time.time()
          buf = ""
          deadline = time.time() + 540

          with open(serial_log, "wb") as log_fh:
              while time.time() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError(f"QEMU exited prematurely with code {proc.returncode}!")
                  rlist, _, _ = select.select([ser], [], [], 0.25)
                  if rlist:
                      chunk = ser.recv(4096)
                      if chunk:
                          log_fh.write(chunk)
                          log_fh.flush()
                          buf += chunk.decode("utf-8", errors="replace")

                  tail = buf[state_pos:]
                  if state == "WAIT_LOGIN":
                      if "kian-os login:" in tail:
                          time.sleep(0.5)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "kian\n")
                          state = "WAIT_AUTH"
                  elif state == "WAIT_AUTH":
                      if "Password:" in tail:
                          time.sleep(0.3)
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "kian\n")
                          state = "WAIT_SHELL"
                      elif ("kian@kian-os" in tail or "$ " in tail):
                          state_pos = len(buf)
                          send_serial(ser, probe1_cmd)
                          state = "WAIT_PROBE1"
                      elif time.time() - state_ts > 15:
                          state_pos = len(buf)
                          state_ts = time.time()
                          send_serial(ser, "\nkian\n")
                  elif state == "WAIT_SHELL":
                      if ("kian@kian-os" in tail or "$ " in tail):
                          time.sleep(0.3)
                          state_pos = len(buf)
                          send_serial(ser, probe1_cmd)
                          state = "WAIT_PROBE1"
                  elif state == "WAIT_PROBE1":
                      if "KIYAN_PROBE1_DONE_123" in tail:
                          m_vt = None
                          for line in buf.splitlines():
                              if "SESSION sid=" in line and "vt=" in line:
                                  vts = line.split("vt=")[-1].strip()
                                  if vts.isdigit() and int(vts) > 0:
                                      m_vt = int(vts)
                          qmp_switch_vt(m_vt or 2)
                          time.sleep(4.0)
                          qmp_send_key(["shift"])
                          time.sleep(2.0)
                          qmp_screendump(ppm_desk)
                          state_pos = len(buf)
                          send_serial(ser, probe2_cmd)
                          state = "WAIT_PROBE2"
                  elif state == "WAIT_PROBE2":
                      if "KIYAN_PROBE2_DONE_211" in tail:
                          qmp_send_key(["shift"])
                          time.sleep(2.0)
                          qmp_screendump(ppm_app)
                          state_pos = len(buf)
                          send_serial(ser, probe3_cmd)
                          state = "WAIT_PROBE3"
                  elif state == "WAIT_PROBE3":
                      if "KIYAN_PROBE3_DONE_345" in tail:
                          qmp_send_key(["shift"])
                          time.sleep(2.0)
                          qmp_screendump(ppm_cal)
                          break

          for p in (ppm_desk, ppm_app, ppm_cal):
              if not os.path.exists(p):
                  qmp_screendump(p)

          ser.close()
          proc.terminate()
          try:
              proc.wait(timeout=10)
          except subprocess.TimeoutExpired:
              proc.kill()
          PY

          convert /tmp/qemu-live/live_desktop.ppm "output/desktop_${EDITION}.png"
          convert /tmp/qemu-live/appearance_desktop.ppm "output/appearance_${EDITION}.png"
          convert /tmp/qemu-live/calamares_desktop.ppm "output/calamares_${EDITION}.png"
          cp -f /tmp/qemu-live/live_serial.log "output/live_serial_${EDITION}.log"

          tail -n 80 "output/live_serial_${EDITION}.log" | tr -d '\033\r'

          # HARD GATES (ZERO || true!)
          grep -qi "liquorix" /tmp/qemu-live/live_serial.log
          grep -q "/dev/ntsync" /tmp/qemu-live/live_serial.log
          grep -q "SQUASHFS_SOURCE_OK_55" /tmp/qemu-live/live_serial.log
          grep -q "GNOME_WAYLAND_READY_42" /tmp/qemu-live/live_serial.log
          grep -q "APPEARANCE_GUI_ALIVE_33" /tmp/qemu-live/live_serial.log
          grep -q "CALAMARES_GUI_ALIVE_77" /tmp/qemu-live/live_serial.log
          test -s "output/desktop_${EDITION}.png"
          test -s "output/appearance_${EDITION}.png"
          test -s "output/calamares_${EDITION}.png"
          echo "[PASS] Kiyan OS v4 (${EDITION}) booted Zorin GNOME 46 Wayland + Unlocked Appearance + Calamares!"

      - name: Split ISO If Over GitHub Release 2.0 GiB Single-Asset Limit & Create 1-Click Reassembler
        run: |
          set -euo pipefail
          cd output
          EDITION="${{ matrix.edition }}"
          ISO="kiyan-os-v4-${EDITION}-noble-amd64.iso"
          SIZE=$(stat -c%s "$ISO")
          echo "ISO $ISO exact size: $SIZE bytes"
          if [[ "$SIZE" -ge 2097152000 ]]; then
            echo "ISO >= 2.0 GiB ($SIZE B); creating 1900M parts + 1-click Windows/Linux joiner scripts..."
            split -b 1900M -d -a 2 "$ISO" "${ISO}.part"
            rm -f "$ISO"
            PARTS_WIN=$(ls -1 "${ISO}.part"* | tr '\n' '+' | sed 's/+$//')
            printf "@echo off\r\necho Assembling %s ...\r\ncopy /b %s %s\r\necho Done! Ready to flash with Rufus or Ventoy.\r\npause\r\n" \
              "$ISO" "$PARTS_WIN" "$ISO" > "Join-Kiyan-OS-${EDITION}.bat"
            printf "#!/usr/bin/env bash\nset -e\ncat %s.part* > %s\nsha256sum -c %s.sha256\necho 'Done!'\n" \
              "$ISO" "$ISO" "$ISO" > "join-kiyan-os-${EDITION}.sh"
            chmod +x "join-kiyan-os-${EDITION}.sh"
          fi
          rm -f "SHA256SUMS-${EDITION}.txt"
          sha256sum ./* > "/tmp/SHA256SUMS-${EDITION}.txt"
          mv -f "/tmp/SHA256SUMS-${EDITION}.txt" "SHA256SUMS-${EDITION}.txt"
          ls -lh .

      - name: Upload Live Boot Screenshots & Logs Artifact (${{ matrix.edition }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiyan-os-v4-${{ matrix.edition }}-evidence
          path: |
            output/*.png
            output/*.log
            output/*.sha256
            output/SHA256SUMS-*.txt
          if-no-files-found: ignore

      - name: Publish Kiyan OS v4 (${{ matrix.edition }}) to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd output
          TAG="kiyan-v4-build-${GITHUB_RUN_NUMBER}"
          TITLE="Kiyan OS v4 (Core & Pro — 100% Free Zorin 18 + GNOME 46 + macOS/Win11 + Liquorix 7.3) Build #${GITHUB_RUN_NUMBER}"
          NOTES="Official Kiyan OS v4 Core & Pro Editions (100% Free). Built on Genuine Zorin OS 18 (GNOME 46 Wayland) + Unlocked macOS Sequoia & Windows 11 Layouts + Frosted Bar/Dock Glass (Solid Window Bodies) + Next-Gen Linux 7.3 Liquorix 1000Hz Superkernel (Native NTSync + TCP BBRv3 + 2026 AMDGPU Full RGB) + Atomic Btrfs Rollback + Custom Kiyan Boot Splash."
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" --clobber ./*; then
                echo "[RELEASE OK] Uploaded ${EDITION:-${{ matrix.edition }}} assets to $TAG"
                exit 0
              fi
            else
              if gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest ./*; then
                echo "[RELEASE OK] Created $TAG and uploaded ${EDITION:-${{ matrix.edition }}} assets"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "FATAL: Failed to publish GitHub Release $TAG after 5 attempts!" >&2
          exit 1
