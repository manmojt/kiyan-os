name: Build Kiyan OS LB1

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_image:
        description: Rebuild and sign the OS image before building the ISO
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kiyan-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.build_image)
    name: Build and sign OCI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push with BlueBuild
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: recipe.yml
          cli_version: v0.9.41
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry: ghcr.io
          registry_namespace: manmojt
          registry_token: ${{ github.token }}
          registry_username: ${{ github.repository_owner }}
          pr_event_number: ${{ github.event.number || 0 }}
          chunkah: true
          maximize_build_space: true

  build-iso-and-publish:
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs['build-image'].result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_image == false && needs['build-image'].result == 'skipped')) }}
    name: Build ISO and publish signed release
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ISO signature inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbsigntool sqlite3 xorriso

      - name: Configure rootful Podman storage for image-builder
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf >/dev/null
          sudo podman info >/dev/null
          echo "update DBConfig set GraphDriver = 'overlay' where GraphDriver = '';" \
            | sudo sh -c '(cd /var/lib/containers/storage && sqlite3 db.sql)'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/cosign-bin

      - name: Verify signed source image
        env:
          COSIGN_BIN: ${{ runner.temp }}/cosign-bin
        run: |
          "$COSIGN_BIN/cosign" verify --key cosign.pub ghcr.io/manmojt/kiyan-os:latest

      - name: Build Fedora-aware installer input and Anaconda ISO
        id: build-anaconda-iso
        run: |
          set -euo pipefail
          # Use the upstream source-built BIB image, which includes Fedora 45 repo data.
          builder_image=ghcr.io/osbuild/bootc-image-builder@sha256:c97a53170d2abac6e469c2cd7f5636ff19af74ab2c8b1995cce50c5a2bd70e3e
          source_image=ghcr.io/manmojt/kiyan-os:latest

          sudo podman pull "$builder_image"
          sudo podman pull "$source_image"

          # BIB resolves its installer RPM repositories from ID=, while the
          # published Kiyan OS correctly uses ID=kiyan. Build a runner-local
          # copy with Fedora's ID for RPM resolution. The kickstart below
          # switches the installed system back to the published Kiyan image.
          iso_context="$RUNNER_TEMP/kiyan-iso-builder"
          mkdir -p "$iso_context"
          cat > "$iso_context/Containerfile" <<'EOF'
          FROM ghcr.io/manmojt/kiyan-os:latest
          RUN set -eux; \
              if [ -f /etc/os-release ] && [ ! -L /etc/os-release ]; then \
                sed -i -E 's/^ID="?kiyan"?$/ID=fedora/' /etc/os-release; \
              fi; \
              sed -i -E 's/^ID="?kiyan"?$/ID=fedora/' /usr/lib/os-release; \
              grep -qx 'ID=fedora' /etc/os-release; \
              grep -qx 'ID=fedora' /usr/lib/os-release; \
              grep -Eq '^VERSION_ID="?[0-9]+"?$' /usr/lib/os-release
          EOF
          sudo podman build --tag localhost/kiyan-os:iso-builder "$iso_context"
          sudo podman run --rm --entrypoint /usr/bin/grep localhost/kiyan-os:iso-builder \
            -E '^(ID|ID_LIKE|VERSION_ID)=' /usr/lib/os-release

          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt label=type:unconfined_t \
            --network host \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$GITHUB_WORKSPACE/output:/output" \
            --volume "$GITHUB_WORKSPACE/iso-config.toml:/config.toml:ro" \
            "$builder_image" build \
              --output /output \
              --rootfs ext4 \
              --config /config.toml \
              --use-librepo=True \
              --type anaconda-iso \
              localhost/kiyan-os:iso-builder

          sudo chown -R "$(id -u):$(id -g)" output
          iso_path="$(find "$GITHUB_WORKSPACE/output" -type f -name '*.iso' -print -quit)"
          test -n "$iso_path"
          echo "anaconda-iso-output-path=$iso_path" >> "$GITHUB_OUTPUT"

      - name: Validate ISO boot entries and signed UEFI shim
        env:
          ISO_PATH: ${{ steps.build-anaconda-iso.outputs.anaconda-iso-output-path }}
        run: |
          set -euo pipefail
          test -s "$ISO_PATH"
          mkdir -p output
          iso=output/Kiyan-OS-LB1-x86_64.iso
          mv "$ISO_PATH" "$iso"
          test -s "$iso"
          file "$iso"

          xorriso -indev "$iso" -report_el_torito plain | tee output/boot-media-report.txt
          grep -qi 'BIOS' output/boot-media-report.txt
          grep -qi 'UEFI' output/boot-media-report.txt

          xorriso -osirrox on -indev "$iso" \
            -extract /EFI/BOOT/BOOTX64.EFI output/BOOTX64.EFI
          test -s output/BOOTX64.EFI
          sbverify --list output/BOOTX64.EFI

      - name: Sign ISO and split it into GitHub Release-sized assets
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          iso=output/Kiyan-OS-LB1-x86_64.iso
          key="$RUNNER_TEMP/cosign.key"
          umask 077
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key"
          "$RUNNER_TEMP/cosign-bin/cosign" sign-blob --yes --key "$key" \
            --bundle "$iso.sigstore.json" "$iso"
          (cd output && sha256sum Kiyan-OS-LB1-x86_64.iso > Kiyan-OS-LB1-x86_64.iso.sha256)
          split --bytes=1800MiB --numeric-suffixes=0 --suffix-length=3 \
            "$iso" "$iso.part-"

      - name: Publish versioned public release for the VPS pull timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="kiyan-lb1-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          mapfile -t parts < <(find output -maxdepth 1 -type f -name 'Kiyan-OS-LB1-x86_64.iso.part-*' -print | sort)
          if (( ${#parts[@]} == 0 )); then
            echo 'ISO split produced no release assets' >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Kiyan OS LB1 ${GITHUB_RUN_NUMBER}" \
            --notes "Automated, signed Kiyan OS LB1 ISO for commit ${GITHUB_SHA}." \
            --latest \
            output/Kiyan-OS-LB1-x86_64.iso.sha256 \
            output/Kiyan-OS-LB1-x86_64.iso.sigstore.json \
            "${parts[@]}"
