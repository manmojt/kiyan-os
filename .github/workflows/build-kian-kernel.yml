name: Build Kian-OS v3 Superkernel (.deb)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'build/01_build_kernel.sh'
      - '.github/workflows/build-kian-kernel.yml'

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile, Sign & Verify linux-kian v3 (Noble GCC-13 + KVM Boot Gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Runner DNS (Cloudflare DoH + 1.1.1.1) & Switch APT to HTTPS CDN Mirrors
        run: |
          set -euo pipefail
          # 1. Replace systemd-resolved stub symlink with deterministic public resolvers
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\noptions timeout:2 attempts:2\n" \
            | sudo tee /etc/resolv.conf >/dev/null
          sudo chmod 0644 /etc/resolv.conf

          # 2. Bootstrap /etc/hosts via DNS-over-HTTPS IP literal (https://1.1.1.1/dns-query)
          #    Guarantees zero DNS stall even if Azure UDP/53 is throttled or broken
          sudo python3 - <<'PY'
          import json, urllib.request

          hosts = [
              "azure.archive.ubuntu.com",
              "archive.ubuntu.com",
              "security.ubuntu.com",
              "mirrors.edge.kernel.org",
              "github.com",
              "codeload.github.com",
              "objects.githubusercontent.com",
              "git.kernel.org",
          ]
          lines = []
          for h in hosts:
              try:
                  req = urllib.request.Request(
                      f"https://1.1.1.1/dns-query?name={h}&type=A",
                      headers={"Accept": "application/dns-json", "User-Agent": "kian-ci/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=8) as r:
                      data = json.loads(r.read().decode())
                  ips = [
                      ans["data"]
                      for ans in data.get("Answer", [])
                      if ans.get("type") == 1 and ans.get("data")
                  ]
                  if ips:
                      lines.append(f"{ips[0]} {h}")
                      print(f"[DoH] {h} -> {ips[0]}")
              except Exception as exc:
                  print(f"[DoH WARN] {h}: {exc}")

          if lines:
              with open("/etc/hosts", "a", encoding="utf-8") as fh:
                  fh.write("\n# Kian-OS CI DoH Bootstrap\n" + "\n".join(lines) + "\n")
          PY

          # 3. Point Ubuntu 24.04 APT sources away from flaky azure.archive.ubuntu.com to fast HTTPS mirrors
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf "https://mirrors.edge.kernel.org/ubuntu/\nhttps://archive.ubuntu.com/ubuntu/\n" \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$f" ]]; then
              sudo sed -i \
                -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/\?|https://mirrors.edge.kernel.org/ubuntu/|g' \
                -e 's|http://archive\.ubuntu\.com/ubuntu/\?|https://mirrors.edge.kernel.org/ubuntu/|g' \
                -e 's|http://security\.ubuntu\.com/ubuntu/\?|https://security.ubuntu.com/ubuntu/|g' \
                "$f"
            fi
          done

      - name: Free Runner Disk Space & Install Noble Kernel Build + QEMU / Secure Boot Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          printf '%s\0' /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            | sudo xargs -0 -P4 rm -rf || true
          df -h /
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates git build-essential gcc-13 g++-13 debhelper dpkg-dev \
            libncurses-dev bison flex libssl-dev libelf-dev bc dwarves rsync \
            kmod cpio sbsigntool zstd xz-utils patch ccache file fakeroot openssl \
            qemu-system-x86 ovmf
          gcc-13 --version

      - name: Restore Compiler Cache (ccache)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: linux-kian-noble2404-gcc13-${{ github.run_id }}
          restore-keys: |
            linux-kian-noble2404-gcc13-

      - name: Compile & MOK-Sign linux-kian v3 Superkernel (Native Ubuntu 24.04 GCC-13)
        run: |
          set -euo pipefail
          mkdir -p /home/runner/.ccache
          sudo update-ccache-symlinks || true
          ccache --max-size=15G
          ccache -s
          sudo -E env \
            "PATH=/usr/lib/ccache:$PATH" \
            "CCACHE_DIR=/home/runner/.ccache" \
            "DEBIAN_FRONTEND=noninteractive" \
            ./build/01_build_kernel.sh -j "$(nproc)"
          sudo chown -R "$USER:$USER" build/kernel_pkgs build/out/kernel_pkgs /home/runner/.ccache
          ccache -s

      - name: Save Compiler Cache (ccache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: linux-kian-noble2404-gcc13-${{ github.run_id }}

      - name: Strict Cryptographic & Dual-CPU QEMU Boot Gate (Zero Swallowed Errors)
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD"
          rm -rf /tmp/qemu-test
          mkdir -p /tmp/qemu-test/pkg

          IMG_DEB=$(find "$REPO_ROOT/build/kernel_pkgs" -maxdepth 1 -name "linux-image-6.8*-kian-v3_*.deb" ! -name "*dbg*" | head -n1)
          HDR_DEB=$(find "$REPO_ROOT/build/kernel_pkgs" -maxdepth 1 -name "linux-headers-6.8*-kian-v3_*.deb" | head -n1)
          test -f "$IMG_DEB"
          test -f "$HDR_DEB"
          echo "Verified Debian packages: $IMG_DEB | $HDR_DEB"

          dpkg -x "$IMG_DEB" /tmp/qemu-test/pkg
          VMLINUZ=$(find /tmp/qemu-test/pkg/boot -maxdepth 1 -name "vmlinuz-*" | head -n1)
          KCONFIG=$(find /tmp/qemu-test/pkg/boot -maxdepth 1 -name "config-*" | head -n1)
          test -f "$VMLINUZ"
          test -f "$KCONFIG"
          echo "Kernel binary: $VMLINUZ"
          file "$VMLINUZ"

          # 1. Assert single clean version suffix (no duplicate -kian-v3-kian-v3)
          case "$(basename "$VMLINUZ")" in
            *-kian-v3-kian-v3*)
              echo "FATAL: Duplicate -kian-v3 suffix detected in $(basename "$VMLINUZ")" >&2
              exit 1
              ;;
            vmlinuz-6.8.*-kian-v3)
              echo "[PASS] Clean kernel release string: $(basename "$VMLINUZ")"
              ;;
            *)
              echo "FATAL: Unexpected kernel filename $(basename "$VMLINUZ")" >&2
              exit 1
              ;;
          esac

          # 2. Assert Kconfig features (BORE, 1000Hz, NTSYNC, BBR, EFI_STUB, GENERIC_CPU)
          grep -q "^CONFIG_SCHED_BORE=y" "$KCONFIG"
          grep -q "^CONFIG_HZ_1000=y" "$KCONFIG"
          grep -q "^CONFIG_NTSYNC=m" "$KCONFIG"
          grep -q "^CONFIG_TCP_CONG_BBR=y" "$KCONFIG"
          grep -q "^CONFIG_EFI_STUB=y" "$KCONFIG"
          grep -q "^CONFIG_GENERIC_CPU=y" "$KCONFIG"
          echo "[PASS] Mandatory Kconfig flags verified in $KCONFIG"

          # 3. Assert PE/COFF Secure Boot signature on packaged vmlinuz
          sbverify --list "$VMLINUZ"
          sbverify --cert "$REPO_ROOT/keys/kian_mok.pem" "$VMLINUZ"
          echo "[PASS] UEFI Secure Boot PE/COFF signature verified against Kian MOK"

          # 4. Assert ntsync module exists and is signed by KIAN-OS Foundation MOK (not autogenerated key)
          NTSYNC_MOD=$(find /tmp/qemu-test/pkg/lib/modules -name "ntsync.ko*" | head -n1)
          test -f "$NTSYNC_MOD"
          modinfo "$NTSYNC_MOD" | tee /tmp/qemu-test/ntsync_modinfo.txt
          grep -q "signer:.*KIAN-OS" /tmp/qemu-test/ntsync_modinfo.txt
          echo "[PASS] ntsync module present and cryptographically signed by KIAN-OS MOK"

          # 5. QEMU Boot Gate A: Universal baseline x86_64 CPU (qemu64 - catches any illegal opcode / early setup reset)
          set +e
          timeout 25s qemu-system-x86_64 \
            -cpu qemu64 \
            -m 1024M \
            -smp 2 \
            -kernel "$VMLINUZ" \
            -append "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 panic=1" \
            -display none \
            -no-reboot \
            -serial file:/tmp/qemu-test/boot_qemu64.log
          set -e
          echo "=== QEMU BASELINE (qemu64) BOOT LOG SUMMARY ==="
          grep -E "(Linux version|BORE|smpboot:|TCP:.*bbr|VFS: Unable to mount root fs)" /tmp/qemu-test/boot_qemu64.log
          grep -q "Linux version 6.8.12-kian-v3 " /tmp/qemu-test/boot_qemu64.log
          grep -qi "BORE" /tmp/qemu-test/boot_qemu64.log
          grep -q "VFS: Unable to mount root fs" /tmp/qemu-test/boot_qemu64.log
          echo "[PASS] Kernel booted cleanly to PID 1 VFS stage on universal qemu64 CPU (zero early-boot reset!)"

          # 6. QEMU Boot Gate B: Hardware KVM / max CPU
          KVM_ARGS=(-cpu max)
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            KVM_ARGS=(-enable-kvm -cpu host)
          fi
          set +e
          timeout 20s qemu-system-x86_64 \
            "${KVM_ARGS[@]}" \
            -m 1024M \
            -smp 2 \
            -kernel "$VMLINUZ" \
            -append "console=ttyS0,115200 panic=1" \
            -display none \
            -no-reboot \
            -serial file:/tmp/qemu-test/boot_modern.log
          set -e
          grep -q "Linux version 6.8.12-kian-v3 " /tmp/qemu-test/boot_modern.log
          grep -qi "BORE" /tmp/qemu-test/boot_modern.log
          grep -q "VFS: Unable to mount root fs" /tmp/qemu-test/boot_modern.log
          echo "[PASS] Kernel booted cleanly to PID 1 VFS stage on modern CPU (${KVM_ARGS[*]})"

      - name: Upload Kernel Packages & Boot Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-kian-v3-packages-and-logs
          path: |
            build/kernel_pkgs/*.deb
            build/kernel_pkgs/SHA256SUMS
            /tmp/qemu-test/boot_*.log
            /tmp/qemu-test/ntsync_modinfo.txt
          if-no-files-found: ignore

      - name: Publish Verified Kernel Packages (.deb) to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/kernel_pkgs
          ls -lh ./*.deb SHA256SUMS
          TAG="linux-kian-v3-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "linux-kian v3.0.0-1 Verified Superkernel (6.8.12-kian-v3, Noble GCC-13, MOK Signed) #${{ github.run_number }}" \
            --notes "Cryptographically signed (sbverify PASS) and QEMU boot-verified (qemu64 + modern CPU to PID 1, zero boot-loop) build of linux-kian 6.8.12-kian-v3 (BORE 1000Hz, NTSync, BBRv3)." \
            --latest \
            ./*.deb SHA256SUMS
