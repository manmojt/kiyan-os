---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: kiyan-os
description: Kiyan OS (LB1 — Let's Be One), a KDE bootc image based on Bazzite
base-image: ghcr.io/ublue-os/bazzite
image-version: stable
blue-build-tag: v0.9.41
cosign-version: 3.1.4

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - alsa-sof-firmware
        - apfs-fuse
        - aria2
        - bubblewrap
        - dislocker
        - dnsmasq
        # Kiyan Store uses this CLI for its confirmed Distrobox installs.
        - distrobox
        - dracut-live
        - ffmpeg
        - fprintd
        - fprintd-pam
        - firefox
        - glibc-langpack-en
        - glibc-langpack-fa
        - gwenview
        - grub2-common
        - grub2-efi-x64-cdboot
        - grub2-pc-modules
        - grub2-tools
        - hostapd
        - isomd5sum
        - libheif-tools
        - libreoffice-headless
        - librsvg2-tools
        - linux-firmware
        - mpv
        - nftables
        - okular
        - openssl
        - p7zip
        - podman
        - plymouth
        - plymouth-plugin-script
        - python3
        - python3-pillow
        - kdialog
        - qrencode
        - shim-x64
        - squashfs-tools
        - unrar
        - ydotool
        - xorriso
        - yt-dlp
        - wl-clipboard

    # Bazzite already ships terra-ddcutil, which provides ddcutil. Installing
    # Fedora's conflicting ddcutil package would break the base image package set.

  - type: files
    files:
      # Stages the Phase 4–5 Kiyan suite binaries, desktop entries, Firefox
      # policy/new-tab assets, package trust root, and system/user units.
      - source: system
        destination: /

  - type: fonts
    fonts:
      google-fonts:
        - Vazirmatn

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          title: Flathub (system)
        notify: false
        install:
          - org.localsend.localsend_app
          - org.deskflow.deskflow
          - com.github.dynobo.normcap
          - io.github.dvlv.boxbuddyrs
          - it.mijorus.gearlever
          - io.missioncenter.MissionCenter
          - com.github.wwmm.easyeffects
          - dev.lizardbyte.app.Sunshine
          - com.github.qarmin.czkawka

  - type: script
    scripts:
      - setup-kernel-hw.sh
      - gen-kiyan-identity.sh

  - type: kargs
    kargs:
      - i915.enable_guc=3
      - i915.enable_fbc=1
      - intel_idle.max_cstate=10
      - quiet
      - splash
      - loglevel=3
      - snd_intel_dspcfg.dsp_driver=3

  - type: systemd
    system:
      enabled:
        - kiyan-touchpad-watchdog.timer
        - kiyan-battery-pro.service
        - ydotool.service
      # NetShare is intentionally on-demand: its desktop launcher invokes
      # `systemctl start kiyan-netshare.service` only when sharing is wanted.
      # Explicitly disabling it prevents a VPN hotspot from being started at boot.
      disabled:
        - kiyan-netshare.service
    user:
      enabled:
        - kiyan-accent-sync.timer
        - kiyan-purepaste.service
        - kiyan-quicklook-shortcut.service
        # Runs only after user opt-in; the service itself exits without a
        # network request until smart_shopping_opt_in is true.
        - kiyan-browser-sync.timer

  - type: signing

  # Keep the OS identity module after package/repository work; changing ID early
  # can confuse Fedora/COPR identification during the image build.
  - type: os-release
    properties:
      NAME: Kiyan OS
      PRETTY_NAME: "Kiyan OS (LB1 — Let's Be One)"
      ID: kiyan
      ID_LIKE: fedora
      DEFAULT_LOCALE: en_US.UTF-8

  # This must follow the hardware, live-ISO, and Plymouth configuration above.
  - type: initramfs
