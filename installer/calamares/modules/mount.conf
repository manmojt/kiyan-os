# ==============================================================================
# KIAN-OS v3 Calamares Mount & Btrfs Subvolume Configuration
# Path: installer/calamares/modules/mount.conf
# Description: Mounts pseudo-filesystems, defines atomic Btrfs subvolumes,
#              and enforces Zstd-3 + async discard mount options.
# ==============================================================================
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
  - device: /run/systemd/resolve
    mountPoint: /run/systemd/resolve
    options: [ bind ]

# Automated Btrfs Flat Subvolume Layout (/var/lib/dpkg stays inside @rootfs)
btrfsSubvolumes:
  - mountPoint: "/"
    subvolume: "/@rootfs"
  - mountPoint: "/.snapshots"
    subvolume: "/@snapshots"
  - mountPoint: "/home"
    subvolume: "/@home"
  - mountPoint: "/var/log"
    subvolume: "/@log"
  - mountPoint: "/var/cache"
    subvolume: "/@cache"
  - mountPoint: "/var/crash"
    subvolume: "/@crash"
  - mountPoint: "/var/tmp"
    subvolume: "/@tmp"

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: btrfs
    options: [ compress=zstd:3, noatime, space_cache=v2 ]
    ssdOptions: [ ssd, discard=async ]
    hddOptions: [ autodefrag ]
  - filesystem: ext4
    options: [ defaults, noatime ]
    ssdOptions: [ discard ]
  - filesystem: xfs
    options: [ defaults, noatime ]
    ssdOptions: [ discard ]
  - filesystem: swap
    options: [ defaults ]
    ssdOptions: [ discard ]
