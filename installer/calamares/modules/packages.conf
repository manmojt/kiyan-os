# ==============================================================================
# KIAN-OS v3 Calamares Packages Configuration (Offline-Safe USB Installation)
# Path: installer/calamares/modules/packages.conf
# ==============================================================================
---
backend: apt
update_db: false
update_system: false
skip_if_no_internet: true

operations:
  - try_remove:
      - calamares
      - calamares-settings-ubuntu-common
      - casper
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-tools
      - ubiquity
      - ubiquity-frontend-kde
