# ==============================================================================
# KIAN-OS v3 Calamares Packages Configuration
# Path: installer/calamares/modules/packages.conf
# Description: Post-install package installation and live package purge configuration.
# ==============================================================================
---
backend: apt

operations:
  - remove:
      - calamares
      - calamares-settings-ubuntu-common
      - casper
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-tools
      - ubiquity
      - ubiquity-frontend-kde
  - try_remove:
      - discover-flatpak-backend
