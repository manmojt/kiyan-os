# ==============================================================================
# KIAN-OS v3 Calamares Unpackfs Configuration
# Path: installer/calamares/modules/unpackfs.conf
# Description: Configuration for extracting live squashfs rootfs to target disk.
# ==============================================================================
---
unpack:
  - source: "/cdrom/casper/filesystem.squashfs"
    sourcefs: "squashfs"
    destination: ""
    weight: 100
