# ==============================================================================
# KIAN-OS v3 Calamares Bootloader Configuration (UEFI + BIOS Fallback)
# Path: installer/calamares/modules/bootloader.conf
# ==============================================================================
---
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "kian-os"
installEFIFallback: true
