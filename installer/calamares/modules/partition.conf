# ==============================================================================
# KIAN-OS v3 Calamares Partitioning Configuration
# Path: installer/calamares/modules/partition.conf
# Description: Automated Btrfs subvolume layout & EFI system partition mapping.
# ==============================================================================
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1024M
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

userSwapChoices:
  - none
  - file
  - suspend
initialSwapChoice: file

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"

# Automated Btrfs Flat Subvolume Layout
# Note: /var/lib/dpkg resides directly within @rootfs for atomic APT rollbacks
btrfsSubvolumes:
  - mountPoint: "/"
    subvolume: "/@rootfs"
  - mountPoint: "/.snapshots"
    subvolume: "/@snapshots"
  - mountPoint: "/home"
    subvolume: "/@home"
  - mountPoint: "/var/log"
    subvolume: "/@log"
  - mountPoint: "/var/cache"
    subvolume: "/@cache"
  - mountPoint: "/var/crash"
    subvolume: "/@crash"

# Default automated partitioning layout for clean drive installations
partitionLayout:
  - name: "EFI"
    filesystem: "fat32"
    mountPoint: "/boot/efi"
    size: 1024M
    flags: [ boot, esp ]
  - name: "KIAN_ROOT"
    filesystem: "btrfs"
    mountPoint: "/"
    size: 100%
