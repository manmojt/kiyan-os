# ==============================================================================
# KIAN-OS v3 Calamares Partitioning Configuration
# Path: installer/calamares/modules/partition.conf
# ==============================================================================
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1024M
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
drawNestedPartitions: true

userSwapChoices:
  - none
  - small
  - suspend
  - file
initialSwapChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"

btrfsSubvolumes:
  - mountPoint: "/"
    subvolume: "/@rootfs"
  - mountPoint: "/.snapshots"
    subvolume: "/@snapshots"
  - mountPoint: "/home"
    subvolume: "/@home"
  - mountPoint: "/var/log"
    subvolume: "/@log"
  - mountPoint: "/var/cache"
    subvolume: "/@cache"
  - mountPoint: "/var/crash"
    subvolume: "/@crash"
  - mountPoint: "/var/tmp"
    subvolume: "/@tmp"

# Note: Calamares creates /boot/efi automatically via efiSystemPartition above.
# Separate unencrypted /boot is created only when LUKS2 full-disk encryption is selected.
partitionLayout:
  - name: "KIAN_BOOT"
    filesystem: "ext4"
    noEncrypt: true
    onlyPresentWithEncryption: true
    mountPoint: "/boot"
    size: 2048M
  - name: "KIAN_ROOT"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
