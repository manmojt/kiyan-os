# ==============================================================================
# Kiyan OS v4 Calamares Display Manager Configuration (GDM3 + Zorin GNOME 46 Wayland)
# Path: installer/calamares/modules/displaymanager.conf
# ==============================================================================
---
displaymanagers:
  - gdm3
  - gdm

defaultDesktopEnvironment:
  executable: "/usr/bin/gnome-session"
  desktopFile: "zorin"

basicSetup: false
sysconfigSetup: false
