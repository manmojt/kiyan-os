# ==============================================================================
# KIAN-OS v3 Calamares Users & Sudo Configuration (Ubuntu 24.04 Groups)
# Path: installer/calamares/modules/users.conf
# ==============================================================================
---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
writeHostsFile: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true

defaultGroups:
  - adm
  - cdrom
  - dip
  - plugdev
  - sudo
  - name: audio
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: render
    must_exist: false
    system: true
  - name: netdev
    must_exist: false
    system: true
  - name: lpadmin
    must_exist: false
    system: true
  - name: sambashare
    must_exist: false
    system: true

passwordRequirements:
  minLength: 1
  maxLength: -1

user:
  shell: /bin/bash
  forbidden_names: [ root ]
