# ==============================================================================
# KIAN-OS v3 Calamares GRUB Configuration (Preserves Dual-Kernel Watchdog ID)
# Path: installer/calamares/modules/grubcfg.conf
# ==============================================================================
---
overwrite: false
keep_distributor: true
prefer_grub_d: false
always_use_defaults: true

kernel_params:
  - "quiet"
  - "preempt=full"
  - "split_lock_mitigate=0"
  - "nouveau.config=NvGspRm=1"
  - "panic=10"

defaults:
  GRUB_TIMEOUT: 3
  GRUB_DEFAULT: "kian_primary"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
