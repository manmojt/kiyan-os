# ==============================================================================
# KIAN-OS v3 Calamares Welcome & System Requirements Configuration
# Path: installer/calamares/modules/welcome.conf
# ==============================================================================
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

requirements:
  requiredStorage: 8.0
  requiredRam: 1.0
  internetCheckUrl: https://github.com/manmojt/kiyan-os
  check:
    - storage
    - ram
    - power
    - root
  required:
    - storage
    - ram
    - root

geoip:
  style: "none"
