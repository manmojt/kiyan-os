# ==============================================================================
# KIAN-OS v3 Calamares Master Settings Configuration
# Path: installer/calamares/settings.conf
# Description: Defines Calamares 3.3.x module discovery, instances, and execution sequence.
# ==============================================================================
---
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules

instances:
  - id: kian_preinstall
    module: shellprocess
    config: shellprocess_kian_preinstall.conf
  - id: kian_driver_and_clean
    module: shellprocess
    config: shellprocess_kian_drivers_and_clean.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - shellprocess@kian_preinstall
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess@kian_driver_and_clean
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: kian
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
