<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ====================================================================== -->
<!-- KIAN-OS v3 Subpixel Typography & Bilingual Font Configuration          -->
<!-- Path: desktop/fonts/50-kian-subpixel-typography.conf                   -->
<!-- Priority: Inter Display (Western Latin/UI) + Vazirmatn (Bilingual)     -->
<!-- ====================================================================== -->
<fontconfig>

  <!-- Global Rasterization & Subpixel Filtering Pipeline -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
    <edit mode="assign" name="embeddedbitmap"><bool>false</bool></edit>
  </match>

  <!-- Metric-Compatible Aliases: Modern System UI Fonts to Inter Display + Vazirmatn -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>-apple-system</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Segoe UI</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Segoe UI Variable</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>SF Pro Display</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Ubuntu</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Cantarell</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Inter Display</string>
      <string>Vazirmatn</string>
    </edit>
  </match>

  <!-- Default Generic Fallbacks -->
  <!-- Sans-Serif: Inter Display -> Vazirmatn -> Noto Sans -> Noto Color Emoji -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter Display</family>
      <family>Vazirmatn</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif: Noto Serif -> Vazirmatn -> DejaVu Serif -> Noto Color Emoji -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Vazirmatn</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Monospace: Fira Code -> JetBrains Mono -> Vazirmatn Code -> Noto Color Emoji -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>JetBrains Mono</family>
      <family>Vazirmatn</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
