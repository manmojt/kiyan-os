# ==============================================================================
# KIAN-OS v3 Pure Wayland SDDM Configuration
# Path: /etc/sddm.conf.d/10-wayland.conf / desktop/sddm/wayland.conf
# Description: Pure Wayland greeter configuration strictly blocking X11 fallback.
# ==============================================================================

[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_QPA_PLATFORM=wayland;xcb
HaltCommand=/bin/systemctl poweroff
RebootCommand=/bin/systemctl reboot
InputMethod=
Numlock=none

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
SessionDir=/usr/share/wayland-sessions

[X11]
# Strictly block legacy X11 display server execution and session discovery
ServerPath=/bin/false
XauthPath=/bin/false
SessionDir=
EnableHiDPI=false

[Theme]
Current=breeze
CursorTheme=breeze_cursors
Font=Inter Display,10,-1,5,50,0,0,0,0,0

[Users]
MaximumUid=60000
MinimumUid=1000
RememberLastUser=true
RememberLastSession=true

[Autologin]
# Pure Wayland autologin targeting KWin Wayland session
Session=plasmawayland.desktop
Relogin=false
